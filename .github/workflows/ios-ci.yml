name: iOS CI
on:
  push:
    paths: ["ios/**", "web/**", "scripts/sync-web-fallback.mjs", ".github/workflows/ios-ci.yml"]
  pull_request:
    paths: ["ios/**", "web/**", "scripts/sync-web-fallback.mjs", ".github/workflows/ios-ci.yml"]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: node scripts/sync-web-fallback.mjs
      - name: Install and verify XcodeGen 2.46.0
        run: |
          brew install xcodegen
          xcodegen --version | grep '2.46.0'
      - run: xcodegen generate
        working-directory: ios
      - name: Build without signing
        run: >-
          xcodebuild -project ios/Giraffe.xcodeproj -scheme Giraffe
          -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
          CODE_SIGNING_ALLOWED=NO build test
