name: Web CI
on:
  push:
    paths: ["web/**", "contracts/**", "scripts/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["web/**", "contracts/**", "scripts/**", ".github/workflows/web-ci.yml"]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: node scripts/package-web.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-web-candidate
          path: artifacts/giraffe-web.zip
          if-no-files-found: error
