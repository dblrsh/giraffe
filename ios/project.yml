name: Giraffe
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  Giraffe:
    type: application
    platform: iOS
    sources:
      - path: Giraffe
        excludes:
          - Resources/WebFallback
      - path: Giraffe/Resources/WebFallback
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.giraffe
        INFOPLIST_FILE: Giraffe/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Giraffe/Resources/Giraffe.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets:
        - GiraffeTests
  GiraffeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GiraffeTests
    dependencies:
      - target: Giraffe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.giraffe.tests
        GENERATE_INFOPLIST_FILE: YES
